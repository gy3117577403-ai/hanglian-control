name: Build V3.18 PostgreSQL Candidate Images

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build. Leave empty for the workflow branch.
        required: false
        default: ""
  push:
    branches:
      - feature/v3-18-postgres-foundation
    paths:
      - "apps/api/**"
      - "Dockerfile.api"
      - "Dockerfile.migrate"
      - "package.json"
      - "package-lock.json"
      - "scripts/run-prisma-migrate-deploy.mjs"
      - "scripts/postgres-migration-image-check.mjs"
      - "scripts/prisma-v318-incremental-migration-check.mjs"
      - ".github/workflows/build-images-manual.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: v318-postgres-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build API and Migration Runner Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          full_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "full_sha=${full_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${owner_lower}/hanglian-control-api" >> "$GITHUB_OUTPUT"
          echo "migrate_image=ghcr.io/${owner_lower}/hanglian-control-api-migrate" >> "$GITHUB_OUTPUT"
          echo "api_version_tag=v3.18-postgres-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "api_sha_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "api_candidate_tag=v3.18-postgres-candidate" >> "$GITHUB_OUTPUT"
          echo "migrate_version_tag=v3.18-migrate-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "migrate_sha_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "migrate_candidate_tag=v3.18-migrate-candidate" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Preflight checks
        run: |
          npm run prisma-v318-incremental-migration:check
          npm run postgres-migration-image:check
          npm run postgres-foundation:check
          npm run postgres-security-gates:check
          npm run json-migration-tooling:check
          npm run repository-parity-contract:check
          npx prisma format --schema=apps/api/prisma/schema.prisma
          npx prisma validate --schema=apps/api/prisma/schema.prisma
          npx prisma generate --schema=apps/api/prisma/schema.prisma
          npm run build -w api
          npm run security:check
          npm run build
          npm run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ steps.meta.outputs.full_sha }}
            OCI_VERSION=${{ steps.meta.outputs.api_version_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.api_version_tag }}
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.api_version_tag }}
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.api_sha_tag }}
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.api_candidate_tag }}

      - name: Smoke test API image
        shell: bash
        run: |
          set -euo pipefail
          api_image="${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.api_version_tag }}"
          docker pull "$api_image"
          smoke_root="${RUNNER_TEMP}/hanglian-api-smoke"
          mkdir -p "${smoke_root}/uploads" "${smoke_root}/metadata" "${smoke_root}/tmp"
          chmod -R 777 "${smoke_root}"
          if docker ps -a --format '{{.Names}}' | grep -qx 'hanglian-api-smoke'; then
            docker rm -f hanglian-api-smoke >/dev/null
          fi
          if ! docker run -d \
            --name hanglian-api-smoke \
            -p 18080:3000 \
            -v "${smoke_root}:/data/hanglian" \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e API_PREFIX=api \
            -e DATA_SOURCE=mock \
            -e DEMO_DATA_MODE=demo \
            -e DEPLOYMENT_STAGE=v3.18-postgres-candidate-smoke \
            -e DB_TARGET=local \
            -e FILE_STORAGE_PROVIDER=local \
            -e STORAGE_ROOT=/data/hanglian \
            -e METADATA_ROOT=/data/hanglian/metadata \
            -e STORAGE_TEMP_ROOT=/data/hanglian/tmp \
            -e STORAGE_MAX_FILE_SIZE_MB=30 \
            -e STORAGE_URL_MODE=proxy \
            -e CORS_ORIGINS=https://localhost,https://fqbkxzzolqqq.sealoshzh.site \
            -e CORS_ALLOW_CREDENTIALS=false \
            -e RUN_PRISMA_MIGRATE_DEPLOY=false \
            -e ALLOW_TEST_DB_CONNECT=false \
            -e ALLOW_PRISMA_WRITE=false \
            -e ALLOW_DESTRUCTIVE_DB_ACTIONS=false \
            -e SEED_MODE=dry-run \
            "$api_image"; then
            echo "::error::API smoke container failed to start from image ${api_image}."
            docker image inspect "$api_image" --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}' || true
            docker ps -a || true
            exit 1
          fi
          trap 'docker rm -f hanglian-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:18080/api/health >/tmp/health.json; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' hanglian-api-smoke 2>/dev/null || echo false)" != "true" ]; then
              echo "::error::API smoke container exited before health became ready."
              docker inspect hanglian-api-smoke --format '{{json .State}}' || true
              docker logs hanglian-api-smoke || true
              exit 1
            fi
            sleep 2
          done
          if [ ! -s /tmp/health.json ]; then
            echo "::error::API smoke health endpoint did not become ready."
            docker inspect hanglian-api-smoke --format '{{json .State}}' || true
            docker logs hanglian-api-smoke || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/api/storage/status >/tmp/storage.json
          curl -fsS http://127.0.0.1:18080/api/runtime/info >/tmp/runtime.json
          node - <<'NODE'
          const fs = require('node:fs')
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'))
          const storage = JSON.parse(fs.readFileSync('/tmp/storage.json', 'utf8'))
          const runtime = JSON.parse(fs.readFileSync('/tmp/runtime.json', 'utf8'))
          if (health.dataSource !== 'mock' || health.databaseConnected !== false) throw new Error('health smoke check failed')
          if (storage.provider !== 'local' || storage.databaseConnected !== false) throw new Error('storage smoke check failed')
          if (runtime.dataSource !== 'mock' || runtime.databaseConnected !== false) throw new Error('runtime smoke check failed')
          const text = JSON.stringify({ health, storage, runtime })
          if (/DATABASE_URL|S3_SECRET|SEALOS_TOKEN|GITHUB_TOKEN|WECHAT.*SECRET|postgres(?:ql)?:\/\/|password/i.test(text)) {
            throw new Error('runtime smoke leaked sensitive data')
          }
          NODE

      - name: Build and push Migration Runner image
        id: build-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ steps.meta.outputs.full_sha }}
            OCI_VERSION=${{ steps.meta.outputs.migrate_version_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.migrate_version_tag }}
          tags: |
            ${{ steps.meta.outputs.migrate_image }}:${{ steps.meta.outputs.migrate_version_tag }}
            ${{ steps.meta.outputs.migrate_image }}:${{ steps.meta.outputs.migrate_sha_tag }}
            ${{ steps.meta.outputs.migrate_image }}:${{ steps.meta.outputs.migrate_candidate_tag }}

      - name: Verify Migration Runner image offline
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.migrate_image }}:${{ steps.meta.outputs.migrate_version_tag }}"
          docker pull "$image"
          docker run --rm "$image" node --version
          docker run --rm "$image" npx prisma --version
          docker run --rm -i "$image" node - <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const required = [
            'apps/api/prisma/schema.prisma',
            'apps/api/prisma/migrations/migration_lock.toml',
            'apps/api/prisma/migrations/20260617000100_initial_schema/migration.sql',
            'apps/api/prisma/migrations/20260623010000_v318_persistence_upgrade/migration.sql',
          ]
          for (const file of required) {
            if (!fs.existsSync(file)) throw new Error(`missing ${file}`)
          }
          const initial = crypto
            .createHash('sha256')
            .update(fs.readFileSync('apps/api/prisma/migrations/20260617000100_initial_schema/migration.sql'))
            .digest('hex')
          const incremental = crypto
            .createHash('sha256')
            .update(fs.readFileSync('apps/api/prisma/migrations/20260623010000_v318_persistence_upgrade/migration.sql'))
            .digest('hex')
          if (initial !== 'ef2508e428b7c3264bd06a353036a496afe0028a6ce849cf143f0f40fec6f3f6') throw new Error('initial migration sha mismatch')
          if (incremental !== '027c925924c1e6e5f0ebf153a0a58a72b7c993dcc1db41cf6e0267d121666a8d') throw new Error('incremental migration sha mismatch')
          if (fs.readFileSync('apps/api/prisma/migrations/migration_lock.toml', 'utf8').trim() !== 'provider = "postgresql"') {
            throw new Error('migration lock provider mismatch')
          }
          for (const forbidden of ['apps/api/.env.local', '.env.local', 'apps/api/storage/metadata', 'apps/api/storage/uploads', 'apps/api/storage/tmp']) {
            if (fs.existsSync(forbidden)) throw new Error(`forbidden runtime file copied: ${forbidden}`)
          }
          NODE

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## Hanglian V3.18 PostgreSQL candidate images"
            echo ""
            echo "- Commit SHA: \`${{ steps.meta.outputs.full_sha }}\`"
            echo "- API image: \`${{ steps.meta.outputs.api_image }}\`"
            echo "- API tags: \`${{ steps.meta.outputs.api_version_tag }}\`, \`${{ steps.meta.outputs.api_sha_tag }}\`, \`${{ steps.meta.outputs.api_candidate_tag }}\`"
            echo "- API digest: \`${{ steps.build-api.outputs.digest }}\`"
            echo "- Migration image: \`${{ steps.meta.outputs.migrate_image }}\`"
            echo "- Migration tags: \`${{ steps.meta.outputs.migrate_version_tag }}\`, \`${{ steps.meta.outputs.migrate_sha_tag }}\`, \`${{ steps.meta.outputs.migrate_candidate_tag }}\`"
            echo "- Migration digest: \`${{ steps.build-migrate.outputs.digest }}\`"
            echo "- Initial migration SHA-256: \`ef2508e428b7c3264bd06a353036a496afe0028a6ce849cf143f0f40fec6f3f6\`"
            echo "- Incremental migration SHA-256: \`027c925924c1e6e5f0ebf153a0a58a72b7c993dcc1db41cf6e0267d121666a8d\`"
            echo "- Database connection: not executed"
            echo "- Database migration: not executed"
            echo "- Secret creation: not executed"
            echo "- Sealos deployment: not executed"
          } >> "$GITHUB_STEP_SUMMARY"
