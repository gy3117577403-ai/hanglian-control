name: Build Cloud Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/v3-6-sealos-cloud-deploy-prep

permissions:
  contents: read
  packages: write

concurrency:
  group: build-cloud-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build API And Tablet Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight checks
        run: |
          npm run sealos:cloud-deploy-check
          npm run security:check

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare image tags
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          BRANCH_TAG="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g' | sed -E 's#^-+|-+$##g')"
          SHA_TAG="sha-${GITHUB_SHA::7}"

          {
            echo "API_IMAGE=ghcr.io/${OWNER_LC}/hanglian-control-api"
            echo "TABLET_IMAGE=ghcr.io/${OWNER_LC}/hanglian-control-tablet"
            echo "BRANCH_TAG=${BRANCH_TAG}"
            echo "SHA_TAG=${SHA_TAG}"
          } >> "${GITHUB_ENV}"

      - name: Build and push API image
        run: |
          docker buildx build \
            --file Dockerfile.api \
            --tag "${API_IMAGE}:sealos-test" \
            --tag "${API_IMAGE}:${BRANCH_TAG}" \
            --tag "${API_IMAGE}:${SHA_TAG}" \
            --push \
            .

      - name: Build and push Tablet image
        run: |
          docker buildx build \
            --file Dockerfile.tablet \
            --tag "${TABLET_IMAGE}:sealos-test" \
            --tag "${TABLET_IMAGE}:${BRANCH_TAG}" \
            --tag "${TABLET_IMAGE}:${SHA_TAG}" \
            --push \
            .

      - name: Print Sealos image names
        run: |
          echo "API image: ${API_IMAGE}:sealos-test"
          echo "API image: ${API_IMAGE}:${SHA_TAG}"
          echo "API image: ${API_IMAGE}:${BRANCH_TAG}"
          echo "Tablet image: ${TABLET_IMAGE}:sealos-test"
          echo "Tablet image: ${TABLET_IMAGE}:${SHA_TAG}"
          echo "Tablet image: ${TABLET_IMAGE}:${BRANCH_TAG}"
